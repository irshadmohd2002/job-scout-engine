# Candidate profile — the durable "who am I" definition.
#
# THIS FILE IS A GENERIC, TRACKED EXAMPLE. Every value below is a placeholder
# chosen only to keep the schema structurally complete — it does not describe
# any real person. Do not put real personal, employment, or education details
# into a tracked *.example.yaml file.
#
# To use the engine with your own background:
#   cp config/candidate_profile.example.yaml config/candidate_profile.yaml
# then edit config/candidate_profile.yaml with your real details.
# That file is gitignored (see .gitignore's "config/*.yaml" rule) and must
# never be committed. See README.md "Configuration bootstrap" for the full
# set of files to copy.
#
# Search profiles (config/search_profiles.example.yaml) narrow this per search run.
# All lists are additive signals for the matching pipeline, not hard requirements
# unless explicitly marked as such in a search profile's hard-filter section.

candidate_id: default-candidate

years_experience: 7.0 # placeholder — replace with your real years of experience

current_location:
  country: XX # placeholder ISO 3166-1 alpha-2 — replace with your real country
  region: null
  city: null

nationality: XX # placeholder — replace with your real nationality

seniority_level: manager # one of: associate, manager, senior_manager, associate_director, director

education:
  - level: postgraduate
    degree: "Example Master's Degree (e.g. MBA)"
    field: "Example field (e.g. General Management)"
    institution: "Example Business School"
  - level: undergraduate
    degree: "Example Bachelor's Degree"
    field: "Example field (e.g. Engineering)"
    institution: null

employment_history_summary:
  - "Example: management consultant, Example Consulting Firm A"
  - "Example: public-sector / government role"
  - "Example: technology consultant, Example Professional Services Firm"

