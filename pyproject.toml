[project]
name = "job-scout-engine"
version = "0.1.1"
description = "Deterministic, profession-agnostic job-monitoring and matching engine with optional LLM enrichment — locally installable, configure it for your own profession."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Job Scout Engine" }]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.34",
]
semantic = [
    "fastembed>=0.8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",       # HTTPX mocking for adapter tests
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "build>=1.0",        # opt-in packaging smoke test (tests/test_packaging_smoke.py)
]

[project.scripts]
job-scout = "job_scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scout"]

[tool.hatch.build.targets.sdist]
include = [
    "src/job_scout",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that hit real external services (requires live credentials/network)",
    "packaging: opt-in tests that build a wheel and install it into a throwaway venv (slow)",
]
addopts = "-m 'not integration and not packaging'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's `typer.Option(...)` as a parameter default is the framework's own
# documented pattern, not the mutable-default-argument bug B008 flags.
"src/job_scout/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# fastembed is an optional dependency (the `[semantic]` extra, decisions.md
# D-052/D-057) with no bundled type stubs; matching/semantic.py isolates it
# behind the Embedder protocol so this override never leaks fastembed's own
# (unchecked) types past that one module.
module = ["fastembed.*", "onnxruntime.*"]
ignore_missing_imports = true
