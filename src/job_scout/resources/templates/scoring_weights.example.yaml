# Stage 5 deterministic scoring weights (architecture.md section 10).
# Not personal data — pure algorithm tuning, same status as
# execution_limits.yaml. `config.load_scoring_weights()` falls back to this
# packaged template automatically if no local scoring_weights.yaml override
# exists (architecture.md section 15.2; decisions.md D-021).
#
# `job-scout init` copies this template to scoring_weights.yaml in your own
# per-user data directory; adjust to taste. Component weights must sum to 1.0.
#
# Notification tier thresholds (priority/digest score cutoffs) are NOT here —
# they live in candidate_profile.yaml / search_profiles.yaml
# (notification_thresholds), since they're a candidate/profile preference,
# not a scoring-algorithm constant.

title_role_family: 0.25
responsibilities: 0.15
required_skills: 0.20
transferable_skills: 0.10
seniority_experience: 0.10
sector_relevance: 0.10
education: 0.05
visa_relocation: 0.05

# Stage 2 pre-filter threshold (0-1 scale). Jobs scoring below this on the
# keyword/phrase overlap pre-filter are persisted but not scored further in
# Stage 5 (architecture.md section 10, Stage 2).
prefilter_threshold: 0.15
