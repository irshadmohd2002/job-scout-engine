# Source registry — the compliance-gated catalogue the planner selects from.
#
# THIS IS A GENERIC, PACKAGED TEMPLATE, illustrative rather than exhaustive:
# it shows the breadth of access_mode/approval_status combinations the model
# must support, across real public services, as worked examples — not a
# recommendation to use all of them, and not tied to any one profession.
# Only entries with approval_status: approved AND an auto-executable
# access_mode are ever collected automatically (see architecture.md,
# "Compliance gate"). `job-scout init` copies this template to
# source_registry.yaml in your own per-user data directory.
#
# access_mode: public_api | public_ats_feed | rss_or_sitemap | email_alert |
#              permitted_html | search_discovery | manual_only | disabled
# approval_status: approved | alert_only | requires_authorisation |
#                   manual_review | blocked | deprecated
#
# Milestone 1.1 additions (all optional, default empty = unrestricted —
# architecture.md section 15.7): industry_coverage, sector_coverage,
# seniority_coverage. Shown explicitly on adzuna_api below; every other
# entry relies on the default (unrestricted).
#
# Milestone 2 Deliverable 5 step 1 addition (decisions.md D-040/D-041):
# `capabilities` — a typed SourceCapabilities block describing what a
# source's adapter contract actually supports. Optional; omitting it
# entirely (as every entry below except adzuna_api does) defaults to
# Adzuna-equivalent capabilities, so this field never breaks an existing
# registry file. Shown explicitly on adzuna_api here only to document its
# verified adapter contract (decisions.md D-016/D-031) — the values below
# are identical to SourceCapabilities' own defaults, not a behaviour
# change.
#
# IMPORTANT — every OTHER entry below (every illustrative
# government/portal/email example) has no explicit `capabilities` block and
# therefore inherits the same Adzuna-shaped default via Pydantic's field
# default. This is a deliberate, approved backward-compatibility choice
# (decisions.md D-041 — "every existing registry entry ... keeps validating
# and behaving unchanged"), NOT a verified capability claim for those
# sources: read it as "unknown, inherited default," never as "confirmed to
# behave like Adzuna." Nothing in Milestone 2 Task 1 reads `.capabilities`
# for planning/execution for these entries, and every one of them is
# already non-executable today regardless (manual_review/alert_only/
# requires_authorisation/blocked), so this has no behavioural effect now.
# Each real adapter gets its own explicit, verified `capabilities` block
# when it's actually implemented (Milestone 2 Deliverable 5 steps 5/7/8) —
# reed_api (decisions.md D-046), greenhouse_public_feeds (decisions.md
# D-047), and now lever_public_postings (decisions.md D-048) below.

sources:
  - source_id: adzuna_api
    name: "Adzuna Job Search API"
    source_type: aggregator_api
    # Illustrative coverage list only — verify against Adzuna's current docs
    # before relying on it for a real run (architecture.md R-1). IE was
    # removed after a live run confirmed Adzuna returns HTTP 404 for
    # /v1/api/jobs/ie/search/{page} — a genuine unsupported-market response,
    # not a URL bug (decisions.md D-028).
    geographic_coverage: [GB, DE, NL, SG, CA, AU, US]
    role_coverage: [general]
    industry_coverage: [] # unrestricted — a general aggregator, not industry-specific
    sector_coverage: []
    seniority_coverage: []
    access_mode: public_api
    approval_status: approved
    terms_compliance_status: reviewed_ok
    auth_required: true
    technical_feasibility: high
    expected_value: high
    priority: 100
    polling_frequency_minutes: 720
    config_status: needs_credentials # requires ADZUNA_APP_ID / ADZUNA_APP_KEY
    required_setup_actions:
      - "Register Adzuna developer account and set ADZUNA_APP_ID/ADZUNA_APP_KEY"
    adapter_ref: adzuna
    reliability_score: 0.9
    historical_match_count: null
    duplicate_rate: null
    # Verified against AdzunaAdapter's actual contract (decisions.md
    # D-016/D-031): `what`/`what_or` support keyword + exact-phrase-ish
    # queries, `where`/country-path support location/country filtering (no
    # dedicated city parameter beyond free-text `where`, so city_filter
    # stays true via the same mechanism), no industry/company/remote
    # filter parameter, `salary_min`/`salary_max` present, description is a
    # truncated snippet (not structured), `results_per_page`/page-looping
    # supported, no posting-date filter parameter, stable `id` per
    # listing, `redirect_url` is a real canonical application URL.
    capabilities:
      keyword_search: true
      exact_phrase_search: true
      location_filter: true
      country_filter: true
      city_filter: true
      industry_filter: false
      company_filter: false
      remote_filter: false
      salary_data: true
      structured_description: false
      pagination: true
      page_size_control: true
      posting_date_filter: false
      stable_external_job_id: true
      canonical_application_url: true
      max_recommended_queries_per_request: null

  - source_id: reed_api
    name: "Reed.co.uk Jobseeker API"
    source_type: aggregator_api
    # Reed is a UK-only job board (verified against its own developer docs,
    # decisions.md D-046) — GB only, unlike Adzuna's multi-market coverage.
    geographic_coverage: [GB]
    role_coverage: [general]
    industry_coverage: []
    sector_coverage: []
    seniority_coverage: []
    access_mode: public_api
    # Never approved by default (CLAUDE.md hard constraint 1) — Reed's
    # current terms have not been reviewed by this project; a user promotes
    # this entry in their own source_registry.yaml only after confirming
    # current terms themselves (MILESTONE_2.md Deliverable 4 priority
    # matrix: "requires verification").
    approval_status: manual_review
    terms_compliance_status: unclear
    auth_required: true
    technical_feasibility: high
    expected_value: high
    priority: 95
    polling_frequency_minutes: 720
    config_status: needs_credentials # requires REED_API_KEY
    required_setup_actions:
      - "Register a free Reed developer account and set REED_API_KEY"
      - "Review Reed's current terms of use before promoting to approved"
    adapter_ref: reed
    reliability_score: null
    historical_match_count: null
    duplicate_rate: null
    # Verified against ReedAdapter's actual contract (decisions.md D-046,
    # against https://www.reed.co.uk/developers/jobseeker at implementation
    # time): `keywords` is a single generic term parameter with no
    # documented literal-phrase/quote syntax (exact_phrase_search: false);
    # `locationName` is a free-text location filter, the same
    # one-parameter-covers-city-and-location shape already accepted for
    # adzuna_api's `where`-equivalent (city_filter: true) — but there is no
    # separate country-scoping request parameter at all, unlike Adzuna's
    # per-country endpoint path (country_filter: false; geographic coverage
    # above is a registry/planner concept, not an API-side filter);
    # `employerId`/`employerProfileId` exist but do NOT make this a
    # watchlist-scoped source per D-041's explicit warning — Reed stays a
    # normal keyword-search source (company_filter: false); no
    # industry/remote-work parameter is documented; `minimumSalary`/
    # `maximumSalary` are present in the Search response (salary_data:
    # true) but currency is a Details-endpoint-only field this adapter does
    # not call (see sources/reed.py); the Search response's `description`
    # is a single freeform text field, not structured
    # (structured_description: false); `resultsToTake`/`resultsToSkip`
    # give real offset pagination and page-size control, capped at Reed's
    # documented 100-result maximum; no posting-date filter parameter is
    # documented; `jobId` is a stable per-listing identifier
    # (stable_external_job_id: true); the Search response provides no
    # application/job URL at all (only the unused Details endpoint does),
    # so this adapter never acquires one (canonical_application_url: false)
    # — never fabricated from an undocumented URL format.
    capabilities:
      keyword_search: true
      exact_phrase_search: false
      location_filter: true
      country_filter: false
      city_filter: true
      industry_filter: false
      company_filter: false
      remote_filter: false
      salary_data: true
      structured_description: false
      pagination: true
      page_size_control: true
      posting_date_filter: false
      stable_external_job_id: true
      canonical_application_url: false
      max_recommended_queries_per_request: null

  - source_id: greenhouse_public_feeds
    name: "Greenhouse public job-board JSON feeds"
    source_type: ats_feed
    geographic_coverage: [GB, DE, NL, IE, AE, SG, CA, AU, US, IN]
    role_coverage: [general]
    access_mode: public_ats_feed
    approval_status: manual_review
    terms_compliance_status: reviewed_ok
    auth_required: false
    technical_feasibility: high
    expected_value: high
    priority: 90
    polling_frequency_minutes: 360
    config_status: needs_setup # requires per-company board token list (watchlist)
    required_setup_actions:
      - "Build priority-company watchlist with Greenhouse board tokens"
      - "Promote to approved once watchlist + polling cadence are confirmed"
    adapter_ref: greenhouse
    reliability_score: 0.85
    historical_match_count: null
    duplicate_rate: null
    # Verified against GreenhouseAdapter's actual contract (decisions.md
    # D-047, against the official Job Board API docs — grnhse/
    # greenhouse-api-docs, "List jobs" — at implementation time): the
    # list-jobs endpoint has no keyword/query parameter of any kind
    # (keyword_search: false, exact_phrase_search: false), no
    # location/country/city/industry/remote filter parameter
    # (location_filter/country_filter/city_filter/industry_filter/
    # remote_filter: false — geographic_coverage above is a
    # registry/planner concept, never an API-side filter, same precedent as
    # reed_api); `company_filter: true` because this source is genuinely
    # watchlist-scoped — one fetch is implicitly one company's board,
    # exactly D-041's documented meaning, not a keyword source with an
    # incidental company parameter; no salary field is ever returned by
    # this endpoint (salary_data: false — pay_input_ranges exists only on
    # the single-job detail endpoint behind a parameter this adapter never
    # calls); `content` (the description) is a single freeform HTML string,
    # not structured (structured_description: false); no page/per_page/
    # offset/cursor parameter is documented anywhere on this endpoint —
    # every job post is returned in one response (pagination: false,
    # page_size_control: false); no posting-date filter parameter is
    # documented (posting_date_filter: false); `id` is confirmed a stable
    # per-post identifier by the docs themselves (stable_external_job_id:
    # true); `absolute_url` is a genuine, documented canonical link to the
    # job posting (canonical_application_url: true) — unlike reed_api,
    # never fabricated.
    capabilities:
      keyword_search: false
      exact_phrase_search: false
      location_filter: false
      country_filter: false
      city_filter: false
      industry_filter: false
      company_filter: true
      remote_filter: false
      salary_data: false
      structured_description: false
      pagination: false
      page_size_control: false
      posting_date_filter: false
      stable_external_job_id: true
      canonical_application_url: true
      max_recommended_queries_per_request: null

  - source_id: lever_public_postings
    name: "Lever public postings API"
    source_type: ats_feed
    geographic_coverage: [GB, DE, NL, IE, US, CA]
    role_coverage: [general]
    access_mode: public_ats_feed
    approval_status: manual_review
    terms_compliance_status: reviewed_ok
    auth_required: false
    technical_feasibility: high
    expected_value: medium
    priority: 80
    polling_frequency_minutes: 360
    config_status: needs_setup # requires per-company site-slug list (watchlist)
    required_setup_actions:
      - "Build priority-company watchlist with Lever company slugs"
      - "Promote to approved once watchlist + polling cadence are confirmed"
    adapter_ref: lever
    reliability_score: 0.85
    historical_match_count: null
    duplicate_rate: null
    # Verified against LeverAdapter's actual contract (decisions.md D-048,
    # against the official Postings API docs — lever/postings-api — and a
    # live, unauthenticated check at implementation time): the
    # list-postings endpoint has no keyword/query parameter this adapter
    # sends (keyword_search: false, exact_phrase_search: false — team/
    # department/level/location filters exist on the real API but are
    # deliberately never sent, same "one fetch per watchlisted company,
    # unfiltered" shape Greenhouse uses); no location/country/city/
    # industry/remote filter parameter is ever sent by this adapter
    # (location_filter/country_filter/city_filter/industry_filter/
    # remote_filter: false — geographic_coverage above is a
    # registry/planner concept, never an API-side filter this adapter uses,
    # same precedent as reed_api/greenhouse_public_feeds); `company_filter:
    # true` because this source is genuinely watchlist-scoped — one fetch
    # is implicitly one company's site, exactly D-041's documented meaning;
    # `salaryRange` is a real, documented optional field (salary_data:
    # true — unlike greenhouse_public_feeds, which has no salary field at
    # all on its list endpoint); `description`/`descriptionPlain` etc. are
    # freeform HTML/plaintext strings, not structured
    # (structured_description: false); `skip`/`limit` pagination
    # parameters are documented on this endpoint, but this adapter
    # deliberately never sends them (pagination: false, page_size_control:
    # false) because no documented or live-confirmed termination signal
    # (total count/hasMore) exists to know when to stop paging — a
    # conservative, explicitly acknowledged limitation, not an oversight
    # (see sources/lever.py's module docstring); no posting-date filter
    # parameter is documented (posting_date_filter: false); `id` is
    # confirmed a stable per-posting identifier by the docs themselves
    # (stable_external_job_id: true); `hostedUrl` is a genuine, documented
    # canonical link to the job posting (canonical_application_url: true).
    capabilities:
      keyword_search: false
      exact_phrase_search: false
      location_filter: false
      country_filter: false
      city_filter: false
      industry_filter: false
      company_filter: true
      remote_filter: false
      salary_data: true
      structured_description: false
      pagination: false
      page_size_control: false
      posting_date_filter: false
      stable_external_job_id: true
      canonical_application_url: true
      max_recommended_queries_per_request: null

