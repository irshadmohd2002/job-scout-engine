  # D3 implementation (decisions.md D-057 "Open follow-up"): the three
  # fixtures below were added specifically because the pre-D3 similarity
  # analysis found neither existing dataset exercised D3's actual
  # motivating scenario (a genuine role equivalent sharing zero configured
  # target_title/title_alias/role_family vocabulary). No existing fixture
  # above was altered or removed.
  - job_id: b-semrescue-1
    title: "Distributed Systems Engineer (Python)"
    company: "Example Tech Co"
    location: {country: GB, city: London}
    employment_type: full_time
    posted_at: "2026-01-01T00:00:00+00:00"
    label: adjacent_match
    description: >
      Own reliability and scalability for our core platform services.
      Build and operate distributed systems written in Python, apply
      strong api design practices to clean, well documented APIs, and
      work daily with Kubernetes-based infrastructure. Strong ownership
      of production systems, cross-team collaboration, and technical
      mentoring of junior engineers expected. 4-12 years of relevant
      experience. Technology sector, private sector employer.
    rationale: >
      A genuine backend/software-engineering-equivalent role with zero
      literal overlap against any configured target_title, title_alias, or
      role_family: "Distributed Systems Engineer" shares no
      token-coverage-qualifying overlap with "Senior Software Engineer" /
      "Backend Engineer" / "software engineering" / "backend development"
      (verified analytically -- the strongest partial overlap, "engineer",
      covers only 1 of "Backend Engineer"'s 2 content tokens, 0.5 < the
      0.75 coverage threshold), so Stage 5's keyword-only
      title_role_family component scores this job 0.0 despite matching
      every configured required/preferred skill (python, distributed
      systems, api design, kubernetes) and the seniority/sector/education
      signal a strong match carries. This is D3's actual target scenario.

