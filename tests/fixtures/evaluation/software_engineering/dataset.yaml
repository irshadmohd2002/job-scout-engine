# Milestone 2 Deliverable 5 step 11 labelled evaluation dataset
# (decisions.md D-043; MILESTONE_2.md "Evaluation dataset and calibration
# design"). Paired with candidate_profile.yaml/search_profiles.yaml in this
# directory -- a materially different profession (software engineering)
# from ../strategy_chief_of_staff/, proving the engine has no
# profession-specific code path (CLAUDE.md hard constraint 10). Generic
# job-posting text only, no real employer or personal data. Deterministic,
# local, offline fixture data -- never fetched from a live source.
fixtures:
