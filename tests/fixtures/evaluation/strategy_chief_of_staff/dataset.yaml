      sector employer.
    rationale: >
      Deliberately keyword/topically dense in the target vocabulary
      (strategic planning, stakeholder management, program management,
      financial modelling, professional services, private sector)
      without the role itself
      performing any strategic-planning, stakeholder-management, or
      program-management execution -- a communications function dressed
      in the target role's language, MILESTONE_2.md D-043's pattern
      (mirrors a-deceptive-2's own technique), included specifically so
      this fixture clears the Stage 2 pre-filter and reaches a real
      (low) Stage 5 keyword-only score, exercising the calibration risk
      decisions.md D-057 already flagged for D3: raw semantic similarity
      alone tends to rate this kind of posting as closely related to the
      configured role vocabulary, so RESCUE_CAP/SIMILARITY_THRESHOLD must
      not let semantic evidence alone promote it above that real,
      low, keyword-only score.
