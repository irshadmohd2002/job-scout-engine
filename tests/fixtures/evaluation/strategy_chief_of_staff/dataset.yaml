  # D3 implementation (decisions.md D-057 "Open follow-up"): the three
  # fixtures below were added specifically because the pre-D3 similarity
  # analysis found neither existing dataset exercised D3's actual
  # motivating scenario (a genuine role equivalent sharing zero configured
  # target_title/title_alias/role_family vocabulary). No existing fixture
  # above was altered or removed.
  - job_id: a-semrescue-1
    title: "Head of Special Projects (Strategic Planning & Program Management)"
    company: "Example Employer"
    location: {country: GB, city: London}
    employment_type: full_time
    posted_at: "2026-01-01T00:00:00+00:00"
    label: adjacent_match
    description: >
      Reports directly to the CEO, owning the executive office's
      highest-priority cross-functional initiatives end to end.
      Coordinates senior leadership on organisation-wide priorities,
      provides hands-on stakeholder management with department heads, and
      drives program management across multiple concurrent workstreams.
      Financial modelling exposure is a plus, along with strong
      cross-functional leadership. Professional services background,
      private sector employer. MBA preferred. Visa sponsorship available
      for the right candidate.
    rationale: >
      A genuine chief-of-staff-equivalent role (MILESTONE_3.md's own
      motivating example, "Head of Special Projects") with zero literal
      overlap against any configured target_title, title_alias, or
      role_family: "Head of Special Projects" shares no token-coverage-
      qualifying overlap with "Chief of Staff" / "Head of Strategy" /
      "strategy and planning" / "chief of staff" (verified analytically --
      the strongest partial overlap, "head", covers only 1 of "Head of
      Strategy"'s 2 content tokens, 0.5 < the 0.75 coverage threshold), so
      Stage 5's keyword-only title_role_family component scores this job
      0.0 despite matching every configured required/preferred skill,
      seniority, sector, education, and visa signal a strong match
      carries. This is D3's actual target scenario: a human reviewer would
      clearly shortlist this job, but keyword/phrase matching alone cannot
      see why.

  - job_id: a-semrescue-2
