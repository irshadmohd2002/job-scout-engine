# Milestone 2 Deliverable 5 step 11 labelled evaluation dataset
# (decisions.md D-043; MILESTONE_2.md "Evaluation dataset and calibration
# design"). Paired with candidate_profile.yaml/search_profiles.yaml in this
# directory — the strategy/transformation/chief-of-staff/program-management
# role family (CLAUDE.md/decisions.md D-017's "example profile", not the
# engine's scope). Generic job-posting text only, no real employer or
# personal data (CLAUDE.md hard constraint 8). Deterministic, local, offline
# fixture data — never fetched from a live source.
fixtures:
  - job_id: a-strong-1
    title: "Chief of Staff"
    company: "Example Employer"
    location: {country: GB, city: London}
    employment_type: full_time
    posted_at: "2026-01-01T00:00:00+00:00"
    label: strong_match
    description: >
      Chief of Staff role reporting to the CEO. Director-level position,
      6-15 years experience. Responsibilities include strategic planning,
      stakeholder management, and program management across the
      organisation. Financial modelling experience is a plus, along with
      strong cross-functional leadership. Professional services background
      preferred, private sector. MBA preferred. Visa sponsorship available
      for the right candidate.
    rationale: >
      Exact match on the search profile's target_titles ("Chief of Staff"),
      with all required and preferred skills, sector, seniority/experience
      range, education and positive visa-sponsorship evidence present. An
      unambiguous strong match a human reviewer would rank at the top.

