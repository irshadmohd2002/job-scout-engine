      Stage 1 experience-range hard filter. Zero configured
      title/role_family vocabulary overlap, same as a-semrescue-1, but
      included to exercise the borderline band of semantic similarity
      specifically: a reasonable person would recognise some relatedness
      but would not treat this as a real chief-of-staff-equivalent
      shortlist candidate. D3's rescue must not promote this above the
      weak_match band merely because it is topically adjacent.

  - job_id: a-semrescue-3
    title: "Strategic Communications Manager, Strategic Planning, Stakeholder Management & Program Management"
    company: "Example Employer"
    location: {country: NL, city: Amsterdam}
    employment_type: full_time
    posted_at: "2026-01-01T00:00:00+00:00"
